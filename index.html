<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>大人牛乳 Bloom Coffee Milk</title>
    <!-- 引入 Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- 引入 React 和 ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <!-- 引入 Babel 用於解析 JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- 引入 Noto Sans TC 字體 -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Noto Sans TC', sans-serif;
            background-color: #FFFFFF;
            color: #3E2F2D; /* 主要文字顏色 */
        }
        .fade-in-up {
            animation: fadeInUp 1s ease-out;
        }
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        /* 定義指定色變數方便管理 (Tailwind JIT 會直接用 hex) */
        /*
        Main: #F6CED1
        Sub1: #FFA39A
        Sub2: #D93B41
        Text: #3E2F2D
        */
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        // --- 圖示組件 ---
        const IconBase = ({ children, size = 24, className = "" }) => (
            <svg 
                xmlns="http://www.w3.org/2000/svg" 
                width={size} 
                height={size} 
                viewBox="0 0 24 24" 
                fill="none" 
                stroke="currentColor" 
                strokeWidth="2" 
                strokeLinecap="round" 
                strokeLinejoin="round" 
                className={className}
            >
                {children}
            </svg>
        );

        const ShoppingCart = (props) => <IconBase {...props}><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/></IconBase>;
        const Menu = (props) => <IconBase {...props}><line x1="4" x2="20" y1="12" y2="12"/><line x1="4" x2="20" y1="6" y2="6"/><line x1="4" x2="20" y1="18" y2="18"/></IconBase>;
        const X = (props) => <IconBase {...props}><path d="M18 6 6 18"/><path d="m6 6 12 12"/></IconBase>;
        const Coffee = (props) => <IconBase {...props}><path d="M17 8h1a4 4 0 1 1 0 8h-1"/><path d="M3 8h14v9a4 4 0 0 1-4 4H7a4 4 0 0 1-4-4Z"/><line x1="6" x2="6" y1="2" y2="4"/><line x1="10" x2="10" y1="2" y2="4"/><line x1="14" x2="14" y1="2" y2="4"/></IconBase>;
        const Droplets = (props) => <IconBase {...props}><path d="M7 16.3c2.2 0 4-1.83 4-4.05 0-1.16-.57-2.26-1.71-3.19S7.29 6.75 7 5.3c-.29 1.45-1.14 2.8-2.29 3.76S3 11.1 3 12.25c0 2.22 1.8 4.05 4 4.05z"/><path d="M12.56 6.6A10.97 10.97 0 0 0 14 3.02c.5 2.5 2 4.9 4 6.5s3 3.5 3 5.5a6.98 6.98 0 0 1-11.91 4.35"/></IconBase>;
        const Star = (props) => <IconBase {...props}><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></IconBase>;
        const ChevronDown = (props) => <IconBase {...props}><path d="m6 9 6 6 6-6"/></IconBase>;
        const ChevronUp = (props) => <IconBase {...props}><path d="m18 15-6-6-6 6"/></IconBase>;
        const MapPin = (props) => <IconBase {...props}><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"/><circle cx="12" cy="10" r="3"/></IconBase>;
        const Clock = (props) => <IconBase {...props}><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></IconBase>;
        const Facebook = (props) => <IconBase {...props}><path d="M18 2h-3a5 5 0 0 0-5 5v3H7v4h3v8h4v-8h3l1-4h-4V7a1 1 0 0 1 1-1h3z"/></IconBase>;
        const Instagram = (props) => <IconBase {...props}><rect width="20" height="20" x="2" y="2" rx="5" ry="5"/><path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"/><line x1="17.5" x2="17.51" y1="6.5" y2="6.5"/></IconBase>;
        const MessageCircle = (props) => <IconBase {...props}><path d="M7.9 20A9 9 0 1 0 4 16.1L2 22Z"/></IconBase>;
        const Heart = (props) => <IconBase {...props}><path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"/></IconBase>;
        const Smile = (props) => <IconBase {...props}><circle cx="12" cy="12" r="10"/><path d="M8 14s1.5 2 4 2 4-2 4-2"/><line x1="9" x2="9.01" y1="9" y2="9"/><line x1="15" x2="15.01" y1="9" y2="9"/></IconBase>;
        const Sparkles = (props) => <IconBase {...props}><path d="m12 3-1.912 5.813a2 2 0 0 1-1.275 1.275L3 12l5.813 1.912a2 2 0 0 1 1.275 1.275L12 21l1.912-5.813a2 2 0 0 1 1.275-1.275L21 12l-5.813-1.912a2 2 0 0 1-1.275-1.275L12 3Z"/><path d="M5 3v4"/><path d="M9 3v4"/><path d="M2 7h6"/><path d="M2 3h6"/></IconBase>;
        const Truck = (props) => <IconBase {...props}><rect width="16" height="13" x="1" y="3" rx="2"/><polygon points="16 8 20 8 23 11 23 16 16 16 16 8"/><circle cx="5.5" cy="18.5" r="2.5"/><circle cx="18.5" cy="18.5" r="2.5"/></IconBase>;

        // --- SVG 插圖組件 ---

        const HeroIllustration = () => (
            <svg viewBox="0 0 400 300" className="w-full h-full">
                <defs>
                    <linearGradient id="mainGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" stopColor="#F6CED1" />
                        <stop offset="100%" stopColor="#FFA39A" />
                    </linearGradient>
                </defs>
                <circle cx="200" cy="150" r="120" fill="url(#mainGrad)" opacity="0.3" />
                <g transform="translate(150, 40)">
                    {/* Bottle */}
                    <rect x="0" y="40" width="100" height="180" rx="10" fill="#FFFFFF" stroke="#3E2F2D" strokeWidth="2"/>
                    <path d="M3 160 Q 25 150 50 160 T 97 160 V 215 A 8 8 0 0 1 92 218 H 8 A 8 8 0 0 1 3 215 Z" fill="#3E2F2D" opacity="0.1" />
                    <rect x="25" y="10" width="50" height="30" rx="4" fill="#3E2F2D" />
                    <rect x="20" y="35" width="60" height="10" rx="2" fill="#D93B41" />
                    {/* Label */}
                    <rect x="20" y="80" width="60" height="60" rx="4" fill="#F6CED1" />
                    <text x="50" y="115" fontSize="14" textAnchor="middle" fill="#D93B41" fontFamily="serif" fontWeight="bold">BLOOM</text>
                </g>
                <text x="120" y="80" fill="#D93B41" fontSize="24">✨</text>
                <text x="280" y="240" fill="#D93B41" fontSize="24">✨</text>
            </svg>
        );

        const IngredientIllustration = ({ type }) => {
            return (
                <svg viewBox="0 0 200 150" className="w-full h-full">
                    <rect width="200" height="150" fill="#F6CED1" opacity="0.1" />
                    {type === 'bean' && (
                        <g transform="translate(100, 75)">
                            <ellipse rx="35" ry="24" fill="#3E2F2D" transform="rotate(-15)"/>
                            <path d="M-20 -4 Q 0 -12 20 4" stroke="#FFA39A" strokeWidth="2" fill="none" transform="rotate(-15)"/>
                        </g>
                    )}
                    {type === 'milk' && (
                        <g transform="translate(100, 75)">
                            <circle cx="0" cy="0" r="35" fill="#FFFFFF" stroke="#F6CED1" strokeWidth="2"/>
                            <path d="M-25 0 Q 0 15 25 0" fill="none" stroke="#F6CED1" strokeWidth="2" />
                        </g>
                    )}
                    {type === 'sugar' && (
                        <g transform="translate(100, 80)">
                            <path d="M-25 20 L 0 -25 L 25 20 Z" fill="#FFA39A" />
                            <path d="M-15 20 L 10 -25 L 35 20 Z" fill="#F6CED1" transform="translate(10, 5)"/>
                        </g>
                    )}
                    {type === 'water' && (
                        <g transform="translate(100, 75)">
                            <path d="M0 -35 Q 35 0 0 35 Q -35 0 0 -35" fill="#D93B41" opacity="0.6"/>
                        </g>
                    )}
                </svg>
            );
        };

        const ProductBottle = ({ size = "sm" }) => (
            <svg viewBox="0 0 200 300" className="w-full h-full drop-shadow-md">
                <g transform="translate(100, 150)">
                    <rect x="-40" y={size === "sm" ? "-80" : "-110"} width="80" height={size === "sm" ? "160" : "220"} rx="10" fill="#FFFFFF" stroke="#3E2F2D" strokeWidth="2" />
                    <rect x="-30" y="-30" width="60" height="50" rx="4" fill="#F6CED1" />
                    <text x="0" y="-5" textAnchor="middle" fontSize="10" fill="#D93B41" fontWeight="bold">BLOOM</text>
                    <rect x="-25" y={size === "sm" ? "-100" : "-130"} width="50" height="20" rx="2" fill="#3E2F2D" />
                </g>
            </svg>
        );

        const DacquoiseIllustration = () => (
            <svg viewBox="0 0 400 300" className="w-full h-full">
                <g transform="translate(200, 150)">
                    <ellipse cx="0" cy="15" rx="80" ry="25" fill="#F6CED1" />
                    <rect x="-70" y="-5" width="140" height="20" fill="#3E2F2D" />
                    <ellipse cx="0" cy="-15" rx="80" ry="25" fill="#FFA39A" />
                </g>
            </svg>
        );

        const StoryIllustration = () => (
            <svg viewBox="0 0 400 300" className="w-full h-full rounded-[2rem]">
                <rect width="400" height="300" fill="#3E2F2D" />
                <g transform="translate(200, 150)">
                    <path d="M-40 -40 L 40 -40 L 20 20 L -20 20 Z" fill="none" stroke="#FFA39A" strokeWidth="3" />
                    <path d="M-20 20 L -20 40 A 5 5 0 0 0 -15 45 H 15 A 5 5 0 0 0 20 40 L 20 20" fill="none" stroke="#FFA39A" strokeWidth="3" />
                    <path d="M-30 -50 A 30 30 0 0 1 30 -50" stroke="#FFA39A" strokeWidth="2" strokeDasharray="5,5" fill="none" opacity="0.5"/>
                </g>
                <text x="200" y="240" textAnchor="middle" fill="#F6CED1" fontSize="14" letterSpacing="2">HANDMADE</text>
            </svg>
        );

        const BloomCoffeeMilk = () => {
            const [isMenuOpen, setIsMenuOpen] = useState(false);
            const [scrolled, setScrolled] = useState(false);
            const [cartCount, setCartCount] = useState(0);
            const [showToast, setShowToast] = useState(false);

            useEffect(() => {
                const handleScroll = () => {
                    setScrolled(window.scrollY > 50);
                };
                window.addEventListener('scroll', handleScroll);
                return () => window.removeEventListener('scroll', handleScroll);
            }, []);

            const addToCart = () => {
                setCartCount(prev => prev + 1);
                setShowToast(true);
                setTimeout(() => setShowToast(false), 3000);
            };

            const scrollToSection = (id) => {
                setIsMenuOpen(false);
                const element = document.getElementById(id);
                if (element) {
                    element.scrollIntoView({ behavior: 'smooth' });
                }
            };

            return (
                <div className="font-sans text-[#3E2F2D] bg-[#FFFFFF] selection:bg-[#F6CED1] selection:text-[#3E2F2D] overflow-x-hidden">
                
                {/* Toast Notification */}
                <div className={`fixed top-24 right-5 z-50 bg-[#3E2F2D] text-[#F6CED1] px-6 py-3 rounded-full shadow-lg transition-opacity duration-300 flex items-center gap-2 ${showToast ? 'opacity-100' : 'opacity-0 pointer-events-none'}`}>
                    <Smile size={20} /> <span className="font-bold">已加入購物車</span>
                </div>

                {/* Navigation */}
                <nav className={`fixed w-full z-40 transition-all duration-300 ${scrolled ? 'bg-white/90 backdrop-blur-md shadow-sm py-3' : 'bg-transparent py-6 text-[#3E2F2D]'}`}>
                    <div className="container mx-auto px-6 flex justify-between items-center">
                    <div className={`text-2xl font-bold tracking-widest cursor-pointer flex flex-col items-center`} onClick={() => window.scrollTo(0,0)}>
                        <span className="font-serif italic text-3xl">大人牛乳</span>
                        <span className="text-xs tracking-[0.2em] font-medium text-[#D93B41]">Let it bloom.</span>
                    </div>
                    
                    {/* Desktop Menu */}
                    <div className={`hidden md:flex space-x-8 items-center font-medium text-[#3E2F2D]`}>
                        <button onClick={() => scrollToSection('about')} className="hover:text-[#D93B41] transition transform hover:-translate-y-0.5">初心故事</button>
                        <button onClick={() => scrollToSection('ingredients')} className="hover:text-[#D93B41] transition transform hover:-translate-y-0.5">四大堅持</button>
                        <button onClick={() => scrollToSection('new-arrival')} className="hover:text-[#D93B41] transition transform hover:-translate-y-0.5">新品登場</button>
                        <button onClick={() => scrollToSection('shop')} className="hover:text-[#D93B41] transition transform hover:-translate-y-0.5">預購</button>
                        <div className="relative cursor-pointer hover:scale-110 transition text-[#3E2F2D]">
                        <div className={`p-2 rounded-full ${scrolled ? 'bg-[#F6CED1]' : 'bg-white/50'}`}>
                            <ShoppingCart size={20} className={scrolled ? 'text-[#3E2F2D]' : 'text-[#3E2F2D]'} />
                        </div>
                        {cartCount > 0 && (
                            <span className="absolute -top-1 -right-1 bg-[#D93B41] text-white text-xs rounded-full h-5 w-5 flex items-center justify-center border-2 border-white">
                            {cartCount}
                            </span>
                        )}
                        </div>
                    </div>

                    {/* Mobile Menu Button */}
                    <div className={`md:hidden`}>
                        <button onClick={() => setIsMenuOpen(!isMenuOpen)}>
                        {isMenuOpen ? <X size={28} /> : <Menu size={28} />}
                        </button>
                    </div>
                    </div>

                    {/* Mobile Menu Dropdown */}
                    {isMenuOpen && (
                    <div className="md:hidden absolute top-full left-0 w-full bg-white text-[#3E2F2D] shadow-xl py-6 px-6 flex flex-col space-y-4 border-t border-[#F6CED1]">
                        <button onClick={() => scrollToSection('about')} className="text-left text-lg py-3 border-b border-dashed border-[#F6CED1]">初心故事</button>
                        <button onClick={() => scrollToSection('ingredients')} className="text-left text-lg py-3 border-b border-dashed border-[#F6CED1]">四大堅持</button>
                        <button onClick={() => scrollToSection('new-arrival')} className="text-left text-lg py-3 border-b border-dashed border-[#F6CED1]">新品登場</button>
                        <button onClick={() => scrollToSection('shop')} className="text-left text-lg py-3 font-bold text-[#D93B41]">預購</button>
                    </div>
                    )}
                </nav>

                {/* 1. Hero Section */}
                <header className="relative h-screen flex items-center justify-center overflow-hidden bg-[#F6CED1]">
                    <div className="absolute inset-0 z-0 flex items-center justify-center opacity-50 scale-150 blur-sm">
                        <HeroIllustration />
                    </div>
                    
                    <div className="relative z-10 text-center text-[#3E2F2D] px-4 max-w-4xl mx-auto fade-in-up">
                    <div className="inline-block bg-white/40 backdrop-blur-sm px-6 py-2 rounded-full mb-6 border border-white">
                        <span className="tracking-widest text-sm font-medium">✨ 宜蘭礁溪．旅人必喝</span>
                    </div>
                    <h1 className="text-4xl md:text-6xl font-bold mb-6 leading-tight drop-shadow-sm tracking-wide">
                        彷彿置身北海道<br/>
                        重現那口 <span className="font-serif italic text-[#D93B41]">純粹感動</span>
                    </h1>
                    <p className="text-lg md:text-xl mb-10 font-light tracking-wider opacity-90 text-[#3E2F2D]">
                        無需遠行，<br/>來自礁溪的頂級美味，為您宅配到府！
                    </p>
                    <button 
                        onClick={() => scrollToSection('shop')}
                        className="bg-[#D93B41] text-white px-10 py-4 rounded-full text-lg font-bold hover:bg-[#3E2F2D] transition transform hover:scale-105 shadow-lg flex items-center gap-2 mx-auto"
                    >
                        <Sparkles size={20} /> 立即預購
                    </button>
                    </div>
                    
                    <div className="absolute bottom-10 left-1/2 transform -translate-x-1/2 animate-bounce text-[#3E2F2D] opacity-80">
                    <ChevronDown size={32} />
                    </div>
                </header>

                {/* 1.5 Who is a Fan Section */}
                <section className="py-24 px-6 bg-white relative overflow-hidden">
                    <div className="absolute top-0 left-0 w-40 h-40 bg-[#F6CED1] rounded-full mix-blend-multiply filter blur-3xl opacity-30"></div>
                    <div className="absolute bottom-0 right-0 w-40 h-40 bg-[#FFA39A] rounded-full mix-blend-multiply filter blur-3xl opacity-30"></div>

                    <div className="container mx-auto px-6 max-w-4xl relative z-10 text-center">
                        <div className="inline-block bg-[#F6CED1] text-[#D93B41] px-6 py-2 rounded-full text-sm font-bold tracking-wider mb-6 shadow-sm">
                            WHO LOVE US
                        </div>
                        <h2 className="text-3xl md:text-4xl font-bold text-[#3E2F2D] mb-8">
                            誰是大人牛乳的粉絲？
                        </h2>
                        
                        <div className="bg-white rounded-[3rem] p-8 md:p-12 border-2 border-[#F6CED1] shadow-lg">
                            <div className="flex justify-center gap-4 mb-8">
                                <div className="w-12 h-12 bg-[#F6CED1] rounded-full flex items-center justify-center text-[#D93B41]"><Heart size={20} /></div>
                                <div className="w-12 h-12 bg-[#F6CED1] rounded-full flex items-center justify-center text-[#D93B41]"><MapPin size={20} /></div>
                                <div className="w-12 h-12 bg-[#F6CED1] rounded-full flex items-center justify-center text-[#D93B41]"><Smile size={20} /></div>
                            </div>

                            <p className="text-xl text-[#3E2F2D] leading-relaxed font-medium mb-8">
                                大人牛乳總是受到熱愛<span className="text-[#D93B41]">旅行</span>、<span className="text-[#D93B41]">創意</span>、<span className="text-[#D93B41]">閱讀</span>、<span className="text-[#D93B41]">品飲</span>這類美好事物的人們喜愛！
                            </p>
                            <div className="w-16 h-1 bg-[#FFA39A] mx-auto mb-8 rounded-full"></div>
                            <p className="text-[#3E2F2D] text-lg leading-relaxed opacity-80">
                                我們抗拒有毒的食材，厭惡辦公室政治，<br className="hidden md:block"/>
                                重視人與人之間的真誠交流，享受善良帶來的一切美好。
                            </p>
                            
                            <div className="flex flex-wrap justify-center gap-3 mt-8">
                                <span className="bg-[#3E2F2D] text-white px-4 py-1 rounded-full text-sm">#拒絕有毒</span>
                                <span className="bg-[#3E2F2D] text-white px-4 py-1 rounded-full text-sm">#真誠交流</span>
                                <span className="bg-[#3E2F2D] text-white px-4 py-1 rounded-full text-sm">#善良美好</span>
                            </div>
                        </div>
                    </div>
                </section>

                {/* 2. Pain Points & Resonance */}
                <section className="py-24 px-6 bg-[#F6CED1] text-center relative overflow-hidden">
                    <div className="max-w-3xl mx-auto relative z-10">
                    <h2 className="text-2xl md:text-4xl font-bold text-[#3E2F2D] mb-8 leading-normal">
                        「長大才懂，<br/>
                        <span className="inline-block relative">
                        簡單純粹，其實最難。
                        </span>」
                    </h2>
                    <div className="bg-white/80 backdrop-blur-sm p-8 rounded-[2rem] shadow-sm">
                        <div className="space-y-6 text-lg text-[#3E2F2D] leading-relaxed">
                        <p>
                            市售咖啡牛乳總有一堆看不懂的化學算式...<br/>
                            你想找的，是不是那個喝完會不自覺<span className="text-[#D93B41] font-bold">「會心一笑」</span>的味道？
                        </p>
                        <div className="flex justify-center my-4">
                            <div className="w-16 h-1 bg-[#D93B41] rounded-full"></div>
                        </div>
                        <p className="font-bold text-xl text-[#3E2F2D]">
                            不用找了，就是這瓶！
                        </p>
                        <p>
                            這不是化學調味乳，這是獻給大人的真誠創作。<br/>
                            耗時一年研發，我們把那次在北海道喝到的幸福感，通通裝進來了。
                        </p>
                        </div>
                    </div>
                    </div>
                </section>

                {/* 3. Core Advantages (Ingredients) */}
                <section id="ingredients" className="py-20 px-6 bg-white relative">
                    <div className="max-w-6xl mx-auto mt-10">
                    <div className="text-center mb-16">
                        <div className="inline-block bg-[#FFA39A] text-white px-4 py-1 rounded-full text-sm font-bold tracking-wider mb-3">
                        NATURAL INGREDIENTS
                        </div>
                        <h2 className="text-3xl md:text-4xl font-bold text-[#3E2F2D] mb-4">100% 純天然的偏執</h2>
                        <p className="text-[#3E2F2D] opacity-80">我們把世界最好的，都裝進這個可愛的瓶子裡啦！</p>
                    </div>

                    <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-8">
                        {/* Card 1 */}
                        <div className="group bg-white p-6 rounded-[2rem] shadow-md hover:shadow-xl transition duration-300 border border-[#F6CED1]">
                        <div className="h-48 overflow-hidden rounded-3xl mb-6 shadow-inner relative mx-auto transform rotate-2 group-hover:rotate-0 transition duration-500 bg-[#F6CED1]/20">
                            <IngredientIllustration type="bean" />
                            <div className="absolute top-3 left-3 bg-white p-2 rounded-full shadow-md text-[#3E2F2D]">
                            <Coffee size={20} />
                            </div>
