<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>大人牛乳 Bloom Coffee Milk</title>
    <!-- 引入 Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- 引入 React 和 ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <!-- 引入 Babel 用於解析 JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <style>
        /* 自定義動畫設定 */
        @keyframes blob {
            0% { transform: translate(0px, 0px) scale(1); }
            33% { transform: translate(30px, -50px) scale(1.1); }
            66% { transform: translate(-20px, 20px) scale(0.9); }
            100% { transform: translate(0px, 0px) scale(1); }
        }
        .animate-blob {
            animation: blob 7s infinite;
        }
        .animation-delay-2000 {
            animation-delay: 2s;
        }
        .fade-in-up {
            animation: fadeInUp 1s ease-out;
        }
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        // --- 圖示組件 ---
        const IconBase = ({ children, size = 24, className = "" }) => (
            <svg 
                xmlns="http://www.w3.org/2000/svg" 
                width={size} 
                height={size} 
                viewBox="0 0 24 24" 
                fill="none" 
                stroke="currentColor" 
                strokeWidth="2" 
                strokeLinecap="round" 
                strokeLinejoin="round" 
                className={className}
            >
                {children}
            </svg>
        );

        const ShoppingCart = (props) => <IconBase {...props}><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/></IconBase>;
        const Menu = (props) => <IconBase {...props}><line x1="4" x2="20" y1="12" y2="12"/><line x1="4" x2="20" y1="6" y2="6"/><line x1="4" x2="20" y1="18" y2="18"/></IconBase>;
        const X = (props) => <IconBase {...props}><path d="M18 6 6 18"/><path d="m6 6 12 12"/></IconBase>;
        const Coffee = (props) => <IconBase {...props}><path d="M17 8h1a4 4 0 1 1 0 8h-1"/><path d="M3 8h14v9a4 4 0 0 1-4 4H7a4 4 0 0 1-4-4Z"/><line x1="6" x2="6" y1="2" y2="4"/><line x1="10" x2="10" y1="2" y2="4"/><line x1="14" x2="14" y1="2" y2="4"/></IconBase>;
        const Droplets = (props) => <IconBase {...props}><path d="M7 16.3c2.2 0 4-1.83 4-4.05 0-1.16-.57-2.26-1.71-3.19S7.29 6.75 7 5.3c-.29 1.45-1.14 2.8-2.29 3.76S3 11.1 3 12.25c0 2.22 1.8 4.05 4 4.05z"/><path d="M12.56 6.6A10.97 10.97 0 0 0 14 3.02c.5 2.5 2 4.9 4 6.5s3 3.5 3 5.5a6.98 6.98 0 0 1-11.91 4.35"/></IconBase>;
        const Star = (props) => <IconBase {...props}><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></IconBase>;
        const ChevronDown = (props) => <IconBase {...props}><path d="m6 9 6 6 6-6"/></IconBase>;
        const ChevronUp = (props) => <IconBase {...props}><path d="m18 15-6-6-6 6"/></IconBase>;
        const MapPin = (props) => <IconBase {...props}><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"/><circle cx="12" cy="10" r="3"/></IconBase>;
        const Clock = (props) => <IconBase {...props}><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></IconBase>;
        const Facebook = (props) => <IconBase {...props}><path d="M18 2h-3a5 5 0 0 0-5 5v3H7v4h3v8h4v-8h3l1-4h-4V7a1 1 0 0 1 1-1h3z"/></IconBase>;
        const Instagram = (props) => <IconBase {...props}><rect width="20" height="20" x="2" y="2" rx="5" ry="5"/><path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"/><line x1="17.5" x2="17.51" y1="6.5" y2="6.5"/></IconBase>;
        const MessageCircle = (props) => <IconBase {...props}><path d="M7.9 20A9 9 0 1 0 4 16.1L2 22Z"/></IconBase>;
        const Heart = (props) => <IconBase {...props}><path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"/></IconBase>;
        const Smile = (props) => <IconBase {...props}><circle cx="12" cy="12" r="10"/><path d="M8 14s1.5 2 4 2 4-2 4-2"/><line x1="9" x2="9.01" y1="9" y2="9"/><line x1="15" x2="15.01" y1="9" y2="9"/></IconBase>;
        const Sparkles = (props) => <IconBase {...props}><path d="m12 3-1.912 5.813a2 2 0 0 1-1.275 1.275L3 12l5.813 1.912a2 2 0 0 1 1.275 1.275L12 21l1.912-5.813a2 2 0 0 1 1.275-1.275L21 12l-5.813-1.912a2 2 0 0 1-1.275-1.275L12 3Z"/><path d="M5 3v4"/><path d="M9 3v4"/><path d="M2 7h6"/><path d="M2 3h6"/></IconBase>;
        const Truck = (props) => <IconBase {...props}><rect width="16" height="13" x="1" y="3" rx="2"/><polygon points="16 8 20 8 23 11 23 16 16 16 16 8"/><circle cx="5.5" cy="18.5" r="2.5"/><circle cx="18.5" cy="18.5" r="2.5"/></IconBase>;

        // --- SVG 插圖組件 ---

        const HeroIllustration = () => (
            <svg viewBox="0 0 400 300" className="w-full h-full drop-shadow-xl">
                <defs>
                <linearGradient id="coffeeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                    <stop offset="0%" stopColor="#8D6E63" />
                    <stop offset="100%" stopColor="#5D4037" />
                </linearGradient>
                <linearGradient id="milkGrad" x1="0%" y1="0%" x2="0%" y2="100%">
                    <stop offset="0%" stopColor="#FFFFFF" />
                    <stop offset="100%" stopColor="#FFF8F5" />
                </linearGradient>
                </defs>
                <path d="M50 150 Q 30 100 100 80 T 250 100 T 350 200 T 200 280 T 50 150" fill="#FFDAC1" opacity="0.6" />
                
                <g transform="translate(150, 40)">
                <rect x="0" y="40" width="100" height="180" rx="15" fill="url(#milkGrad)" stroke="#5D4037" strokeWidth="3"/>
                <path d="M3 160 Q 25 150 50 160 T 97 160 V 205 A 12 12 0 0 1 85 217 H 15 A 12 12 0 0 1 3 205 Z" fill="url(#coffeeGrad)" opacity="0.9" />
                <rect x="25" y="10" width="50" height="30" rx="5" fill="#5D4037" />
                <rect x="20" y="35" width="60" height="10" rx="2" fill="#8D6E63" />
                <rect x="20" y="80" width="60" height="60" rx="5" fill="#FFEDE6" stroke="#FFB7B2" strokeWidth="2" />
                <text x="50" y="115" fontSize="20" textAnchor="middle" fill="#5D4037" fontFamily="serif" fontStyle="italic">Bloom</text>
                </g>
                
                <g transform="translate(100, 200) rotate(-20)">
                <ellipse cx="0" cy="0" rx="15" ry="10" fill="#5D4037" />
                <path d="M-10 0 Q 0 -5 10 0" stroke="#8D6E63" strokeWidth="2" fill="none" />
                </g>
                <g transform="translate(300, 100) rotate(30)">
                <ellipse cx="0" cy="0" rx="12" ry="8" fill="#5D4037" />
                <path d="M-8 0 Q 0 -4 8 0" stroke="#8D6E63" strokeWidth="2" fill="none" />
                </g>
                
                <text x="120" y="80" fill="#FF8C94" fontSize="24">✨</text>
                <text x="280" y="240" fill="#FF8C94" fontSize="24">✨</text>
            </svg>
        );

        const IngredientIllustration = ({ type }) => {
            const colors = {
                bean: { bg: "#FFF8F5", main: "#5D4037", accent: "#8D6E63" },
                milk: { bg: "#F0F8FF", main: "#AECBFA", accent: "#FFFFFF" },
                sugar: { bg: "#FFF0F5", main: "#FFB7B2", accent: "#FFFFFF" },
                water: { bg: "#E0FFFF", main: "#4DD0E1", accent: "#B2EBF2" }
            };
            const c = colors[type] || colors.bean;

            return (
                <svg viewBox="0 0 200 150" className="w-full h-full">
                <rect width="200" height="150" fill={c.bg} />
                {type === 'bean' && (
                    <g transform="translate(100, 75)">
                    <ellipse rx="40" ry="28" fill={c.main} transform="rotate(-15)"/>
                    <path d="M-25 -5 Q 0 -15 25 5" stroke={c.accent} strokeWidth="3" fill="none" transform="rotate(-15)"/>
                    <ellipse rx="30" ry="20" fill={c.main} transform="translate(40, -30) rotate(20)" opacity="0.8"/>
                    </g>
                )}
                {type === 'milk' && (
                    <g transform="translate(100, 75)">
                    <path d="M0 -40 Q 40 -10 0 40 Q -40 -10 0 -40" fill={c.main} />
                    <circle cx="10" cy="-10" r="5" fill="white" opacity="0.5" />
                    </g>
                )}
                {type === 'sugar' && (
                    <g transform="translate(100, 80)">
                    <path d="M-30 20 L 0 -30 L 30 20 Z" fill={c.main} stroke="#5D4037" strokeWidth="2" strokeLinejoin="round"/>
                    <path d="M-20 20 L 10 -30 L 40 20 Z" fill="#FFDAC1" stroke="#5D4037" strokeWidth="2" strokeLinejoin="round" transform="translate(15, 10)"/>
                    <circle cx="-10" cy="-10" r="2" fill="white"/>
                    </g>
                )}
                {type === 'water' && (
                    <g transform="translate(100, 75)">
                    <path d="M-40 20 Q 0 40 40 20 T -40 20" fill="#B2EBF2" />
                    <path d="M-50 30 Q 0 60 50 30" fill="none" stroke="#4DD0E1" strokeWidth="3" />
                    <circle cx="0" cy="-10" r="8" fill="#4DD0E1" />
                    <circle cx="20" cy="10" r="5" fill="#4DD0E1" />
                    </g>
                )}
                </svg>
            );
        };

        const ProductBottle = ({ size = "sm" }) => (
            <svg viewBox="0 0 200 300" className="w-full h-full drop-shadow-md">
                <g transform="translate(100, 150)">
                <rect x="-40" y={size === "sm" ? "-80" : "-110"} width="80" height={size === "sm" ? "160" : "220"} rx="10" fill="#FFF" stroke="#5D4037" strokeWidth="3" />
                <path d={`M-38 ${size === "sm" ? "40" : "60"} Q 0 ${size === "sm" ? "30" : "50"} 38 ${size === "sm" ? "40" : "60"} V ${size === "sm" ? "75" : "105"} A 8 8 0 0 1 30 ${size === "sm" ? "78" : "108"} H -30 A 8 8 0 0 1 -38 ${size === "sm" ? "75" : "105"} Z`} fill="#8D6E63" opacity="0.9"/>
                <rect x="-30" y="-30" width="60" height="50" rx="2" fill="#FFEDE6" stroke="#FFB7B2" strokeWidth="1" />
                <text x="0" y="-5" textAnchor="middle" fontSize="12" fill="#5D4037" fontWeight="bold">Bloom</text>
                <rect x="-25" y={size === "sm" ? "-100" : "-130"} width="50" height="20" rx="2" fill="#5D4037" />
                </g>
            </svg>
        );

        const DacquoiseIllustration = () => (
            <svg viewBox="0 0 400 300" className="w-full h-full">
                <circle cx="200" cy="150" r="130" fill="#FFDAC1" opacity="0.3" />
                <g transform="translate(200, 150) rotate(5)">
                <ellipse cx="0" cy="20" rx="80" ry="25" fill="#D7CCC8" stroke="#5D4037" strokeWidth="3" />
                <rect x="-70" y="-5" width="140" height="25" fill="#5D4037" />
                <ellipse cx="0" cy="-15" rx="80" ry="25" fill="#EFEBE9" stroke="#5D4037" strokeWidth="3" />
                <circle cx="-30" cy="-20" r="2" fill="#8D6E63" />
                <circle cx="20" cy="-15" r="2" fill="#8D6E63" />
                <circle cx="50" cy="-25" r="2" fill="#8D6E63" />
                </g>
                <text x="280" y="100" fontSize="30">✨</text>
            </svg>
        );

        const StoryIllustration = () => (
            <svg viewBox="0 0 400 300" className="w-full h-full rounded-[2rem]">
                <rect width="400" height="300" fill="#8D6E63" />
                <g transform="translate(200, 150)">
                <path d="M-40 -40 L 40 -40 L 20 20 L -20 20 Z" fill="none" stroke="#FFF" strokeWidth="4" />
                <path d="M-20 20 L -20 40 A 5 5 0 0 0 -15 45 H 15 A 5 5 0 0 0 20 40 L 20 20" fill="none" stroke="#FFF" strokeWidth="4" />
                <path d="M-30 -50 A 30 30 0 0 1 30 -50" stroke="#FFF" strokeWidth="2" strokeDasharray="5,5" fill="none" opacity="0.5"/>
                </g>
                <text x="200" y="240" textAnchor="middle" fill="#FFDAC1" fontSize="14" letterSpacing="2">HANDMADE IN YILAN</text>
            </svg>
        );

        const BloomCoffeeMilk = () => {
            const [isMenuOpen, setIsMenuOpen] = useState(false);
            const [scrolled, setScrolled] = useState(false);
            const [cartCount, setCartCount] = useState(0);
            const [showToast, setShowToast] = useState(false);

            useEffect(() => {
                const handleScroll = () => {
                    setScrolled(window.scrollY > 50);
                };
                window.addEventListener('scroll', handleScroll);
                return () => window.removeEventListener('scroll', handleScroll);
            }, []);

            const addToCart = () => {
                setCartCount(prev => prev + 1);
                setShowToast(true);
                setTimeout(() => setShowToast(false), 3000);
            };

            const scrollToSection = (id) => {
                setIsMenuOpen(false);
                const element = document.getElementById(id);
                if (element) {
                    element.scrollIntoView({ behavior: 'smooth' });
                }
            };

            return (
                <div className="font-sans text-[#5D4037] bg-[#FFF8F5] selection:bg-[#FFB7B2] selection:text-white overflow-x-hidden">
                
                {/* Toast Notification */}
                <div className={`fixed top-24 right-5 z-50 bg-[#8D6E63] text-white px-6 py-3 rounded-2xl shadow-lg transition-opacity duration-300 flex items-center gap-2 ${showToast ? 'opacity-100' : 'opacity-0 pointer-events-none'}`}>
                    <Smile size={20} /> 已加入購物車
                </div>

                {/* Navigation */}
                <nav className={`fixed w-full z-40 transition-all duration-300 ${scrolled ? 'bg-[#FFF8F5]/90 backdrop-blur-md shadow-sm py-3' : 'bg-transparent py-6 text-white'}`}>
                    <div className="container mx-auto px-6 flex justify-between items-center">
                    <div className={`text-2xl font-bold tracking-widest cursor-pointer flex flex-col items-center ${scrolled ? 'text-[#5D4037]' : 'text-white'}`} onClick={() => window.scrollTo(0,0)}>
                        <span className="font-serif italic text-3xl">Bloom.</span>
                        <span className="text-xs tracking-[0.2em] font-medium">大人牛乳</span>
                    </div>
                    
                    {/* Desktop Menu */}
                    <div className={`hidden md:flex space-x-8 items-center font-medium ${scrolled ? 'text-[#8D6E63]' : 'text-white'}`}>
                        <button onClick={() => scrollToSection('about')} className="hover:text-[#FF8C94] transition transform hover:-translate-y-0.5">初心故事</button>
                        <button onClick={() => scrollToSection('ingredients')} className="hover:text-[#FF8C94] transition transform hover:-translate-y-0.5">四大堅持</button>
                        <button onClick={() => scrollToSection('new-arrival')} className="hover:text-[#FF8C94] transition transform hover:-translate-y-0.5">新品登場</button>
                        <button onClick={() => scrollToSection('shop')} className="hover:text-[#FF8C94] transition transform hover:-translate-y-0.5">把美味帶回家</button>
                        <div className="relative cursor-pointer hover:scale-110 transition text-[#FF8C94]">
                        <div className={`p-2 rounded-full ${scrolled ? 'bg-[#FFEDE6]' : 'bg-white/20'}`}>
                            <ShoppingCart size={20} className={scrolled ? 'text-[#5D4037]' : 'text-white'} />
                        </div>
                        {cartCount > 0 && (
                            <span className="absolute -top-1 -right-1 bg-[#FF8C94] text-white text-xs rounded-full h-5 w-5 flex items-center justify-center border-2 border-white">
                            {cartCount}
                            </span>
                        )}
                        </div>
                    </div>

                    {/* Mobile Menu Button */}
                    <div className={`md:hidden ${scrolled ? 'text-[#5D4037]' : 'text-white'}`}>
                        <button onClick={() => setIsMenuOpen(!isMenuOpen)}>
                        {isMenuOpen ? <X size={28} /> : <Menu size={28} />}
                        </button>
                    </div>
                    </div>

                    {/* Mobile Menu Dropdown */}
                    {isMenuOpen && (
                    <div className="md:hidden absolute top-full left-0 w-full bg-[#FFF8F5] text-[#5D4037] shadow-xl py-6 px-6 flex flex-col space-y-4 rounded-b-3xl border-t border-[#FFEDE6]">
                        <button onClick={() => scrollToSection('about')} className="text-left text-lg py-3 border-b border-dashed border-[#FFB7B2]">初心故事</button>
                        <button onClick={() => scrollToSection('ingredients')} className="text-left text-lg py-3 border-b border-dashed border-[#FFB7B2]">四大堅持</button>
                        <button onClick={() => scrollToSection('new-arrival')} className="text-left text-lg py-3 border-b border-dashed border-[#FFB7B2]">新品登場</button>
                        <button onClick={() => scrollToSection('shop')} className="text-left text-lg py-3 font-bold text-[#FF8C94]">把美味帶回家</button>
                    </div>
                    )}
                </nav>

                {/* 1. Hero Section */}
                <header className="relative h-screen flex items-center justify-center overflow-hidden bg-[#8D6E63]">
                    <div className="absolute inset-0 z-0 flex items-center justify-center opacity-40 scale-150 blur-sm">
                    <HeroIllustration />
                    </div>
                    <div className="absolute inset-0 z-0 bg-gradient-to-b from-[#5D4037]/80 to-[#FFEDE6]/20"></div>

                    <div className="relative z-10 text-center text-white px-4 max-w-4xl mx-auto fade-in-up">
                    <div className="inline-block bg-white/20 backdrop-blur-sm px-6 py-2 rounded-full mb-6 border border-white/30">
                        <span className="tracking-widest text-sm font-medium">✨ 宜蘭礁溪．旅人必喝</span>
                    </div>
                    <h1 className="text-4xl md:text-6xl font-bold mb-6 leading-tight drop-shadow-sm tracking-wide">
                        彷彿置身北海道<br/>
                        重現那口 <span className="font-serif italic text-[#FFDAC1]">純粹感動</span>
                    </h1>
                    <p className="text-lg md:text-xl mb-10 font-light tracking-wider opacity-95 text-[#FFF5F2]">
                        無需遠行，<br/>這份來自礁溪的頂級美味，為您宅配到府。
                    </p>
                    <button 
                        onClick={() => scrollToSection('shop')}
                        className="bg-[#FFB7B2] text-[#5D4037] px-10 py-4 rounded-full text-lg font-bold hover:bg-[#FFDAC1] transition transform hover:scale-105 shadow-[0_4px_14px_0_rgba(255,183,178,0.39)] flex items-center gap-2 mx-auto"
                    >
                        <Sparkles size={20} /> 了解更多
                    </button>
                    </div>
                    
                    <div className="absolute bottom-10 left-1/2 transform -translate-x-1/2 animate-bounce text-white opacity-80">
                    <ChevronDown size={32} />
                    </div>
                </header>

                {/* 1.5 Who is a Fan Section */}
                <section className="py-24 px-6 bg-[#FFF3E0] relative overflow-hidden">
                    <div className="absolute top-0 left-0 w-32 h-32 bg-[#FFB7B2] rounded-full mix-blend-multiply filter blur-2xl opacity-40"></div>
                    <div className="absolute bottom-0 right-0 w-40 h-40 bg-[#FFDAC1] rounded-full mix-blend-multiply filter blur-2xl opacity-40"></div>

                    <div className="container mx-auto px-6 max-w-4xl relative z-10 text-center">
                        <div className="inline-block bg-white text-[#5D4037] px-6 py-2 rounded-full text-sm font-bold tracking-wider mb-6 shadow-sm">
                            WHO LOVE US
                        </div>
                        <h2 className="text-3xl md:text-4xl font-bold text-[#5D4037] mb-8">
                            誰會是大人牛乳的粉絲？
                        </h2>
                        
                        <div className="bg-white/60 backdrop-blur-sm rounded-[3rem] p-8 md:p-12 border-2 border-[#FFEDE6] shadow-lg">
                            <div className="flex justify-center gap-4 mb-8">
                                <div className="w-12 h-12 bg-[#FFEDE6] rounded-full flex items-center justify-center text-[#5D4037]"><Heart size={20} /></div>
                                <div className="w-12 h-12 bg-[#FFEDE6] rounded-full flex items-center justify-center text-[#5D4037]"><MapPin size={20} /></div>
                                <div className="w-12 h-12 bg-[#FFEDE6] rounded-full flex items-center justify-center text-[#5D4037]"><Smile size={20} /></div>
                            </div>

                            <p className="text-xl text-[#5D4037] leading-relaxed font-medium mb-8">
                                大人牛乳總是受到<span className="text-[#FF8C94]">熱愛生活</span>、<span className="text-[#FF8C94]">旅行</span>、<span className="text-[#FF8C94]">閱讀</span>、<span className="text-[#FF8C94]">品飲</span>這類美好事物的人們喜愛！
                            </p>
                            <div className="w-16 h-1 bg-[#FFB7B2] mx-auto mb-8 rounded-full"></div>
                            <p className="text-[#8D6E63] text-lg leading-relaxed">
                                我們抗拒有毒的食材，厭惡辦公室政治，<br className="hidden md:block"/>
                                重視人與人之間的真誠交流，享受善良帶來的一切美好。
                            </p>
                            
                            <div className="flex flex-wrap justify-center gap-3 mt-8">
                                <span className="bg-[#5D4037] text-white px-4 py-1 rounded-full text-sm">#拒絕有毒</span>
                                <span className="bg-[#5D4037] text-white px-4 py-1 rounded-full text-sm">#真誠交流</span>
                                <span className="bg-[#5D4037] text-white px-4 py-1 rounded-full text-sm">#善良美好</span>
                            </div>
                        </div>
                    </div>
                </section>

                {/* 2. Pain Points & Resonance */}
                <section className="py-24 px-6 bg-[#FFF8F5] text-center relative overflow-hidden">
                    <div className="absolute top-10 left-10 w-32 h-32 bg-[#FFEDE6] rounded-full mix-blend-multiply filter blur-xl opacity-70 animate-blob"></div>
                    <div className="absolute bottom-10 right-10 w-32 h-32 bg-[#FFDAC1] rounded-full mix-blend-multiply filter blur-xl opacity-70 animate-blob animation-delay-2000"></div>
